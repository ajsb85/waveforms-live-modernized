<ion-menu [contentId]="'main-content'" class="skinned-menu" [swipeGesture]="false">

    <ion-header>
        <ion-toolbar>
            <div class="menu-logo-container">
                <img class="menu-logo" src="assets/img/waveforms-live.svg">
            </div>
        </ion-toolbar>
    </ion-header>

    <ion-content>
        <ion-list>
            <button ion-item *ngFor="let p of pages" (click)="openPage(p)">
                {{p.title}}
            </button>

            <button ion-item (click)="toFeedBack()">
                Feedback And Support
            </button>
            <button ion-item (click)="toReference()">
                Documentation
            </button>
            <button *ngIf="isMobile" ion-item (click)="openAppStore()">
                Get App
            </button>
        </ion-list>
    </ion-content>

</ion-menu>

<ion-nav id="main-content" [root]="rootPage" #content swipeBackEnabled="false"></ion-nav>

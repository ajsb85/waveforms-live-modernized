<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>WaveForms Live</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#4e8ef7">
  <link rel="icon" type="image/x-icon" href="assets/icon/favicon.ico">
  <link rel="manifest" href="manifest.json">
  <script>
    window.addEventListener('load', () => {
      document.querySelector('.loader')?.remove();
    }, { once: true });
  </script>
</head>
<body>
  <div class="loader" style="position: fixed; inset: 0; z-index: 9999; background-color:#535353; justify-content:center; display:flex; align-items:center;">
    <img src="assets/img/waveforms-live.svg" style="width: 60%; max-width: 640px;" alt="WaveForms Live">
  </div>
  <app-root></app-root>
</body>
</html>
